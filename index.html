<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultimatum Floor — Agency Digital Office</title>
  <meta name="description" content="Командный центр цифровых сотрудников. Workers в Munder Difflin локально." />
  <style>
    :root{--bg:#1a1714;--panel:#2a241e;--panel2:#342c24;--ink:#f3ead9;--muted:#b7a892;--line:#4a3f33;--gold:#d4a017;--mint:#2ee6a6;--warn:#e8a54b;--stop:#d4533a;--idle:#8a7d6b}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:IBM Plex Sans,Segoe UI,system-ui,sans-serif}
    body{display:grid;grid-template-rows:48px 1fr 56px}
    header{display:flex;align-items:center;gap:16px;padding:0 14px;background:#221c17;border-bottom:1px solid var(--line)}
    header .brand{font-weight:700}header .brand span{color:var(--gold)}header .tag{color:var(--muted);font-size:12px}header .live{margin-left:auto;font-size:12px;color:var(--mint)}
    main{display:grid;grid-template-columns:1.15fr .85fr;min-height:0}
    .floor{position:relative;margin:10px;background:repeating-linear-gradient(0deg,#2b251f 0 24px,#2e2822 24px 48px);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .room{position:absolute;border:1px solid #5a4c3c;background:rgba(40,34,28,.72);border-radius:6px;padding:6px}
    .room h3{margin:0 0 6px;font-size:11px;color:var(--gold);text-transform:uppercase}
    .agent{display:inline-flex;flex-direction:column;align-items:center;width:64px;margin:4px;cursor:pointer}
    .agent .av{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1a1714;border:2px solid #111}
    .agent .nm{font-size:10px;margin-top:3px}.agent .st{font-size:9px;color:var(--muted)}
    .agent.working .st{color:var(--mint)}.agent.idle .st{color:var(--idle)}.agent.gate .st{color:var(--warn)}
    aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
    .tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
    .tabs button{background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);padding:8px 10px;font-size:11px;cursor:pointer}
    .tabs button.on{color:var(--ink);background:var(--panel2)}
    .pane{flex:1;overflow:auto;padding:12px;font-size:13px;line-height:1.45}.pane h2{margin:0 0 8px;font-size:15px}
    .pane pre,.log{background:#16130f;border:1px solid var(--line);padding:10px;border-radius:6px;font-family:IBM Plex Mono,ui-monospace,monospace;font-size:11px;white-space:pre-wrap}
    .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0}.card b{color:var(--gold)}
    .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
    .gate{border-left:3px solid var(--warn)}.ok{border-left:3px solid var(--mint)}.bad{border-left:3px solid var(--stop)}
    footer{display:flex;align-items:center;gap:10px;padding:0 12px;background:#221c17;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}footer a{color:var(--gold)}
    textarea{width:100%;background:#16130f;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit}
    button.act{background:var(--gold);color:#1a1714;border:0;padding:8px 12px;border-radius:4px;font-weight:700;cursor:pointer}
    .warnbox{background:#3a2a16;border:1px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
<header><div class="brand">ULTIMATUM <span>FLOOR</span></div><div class="tag">Agency Digital Office · hive · GOD = owner clone</div><div class="live" id="clock">STANDING BY</div></header>
<main><section class="floor" id="floor"></section>
<aside><nav class="tabs" id="tabs">
<button class="on" data-tab="god">GOD</button><button data-tab="roster">Roster</button><button data-tab="tasks">Tasks</button><button data-tab="hive">Hive</button><button data-tab="gates">Gates</button><button data-tab="install">Install</button>
</nav><div class="pane" id="pane"></div></aside></main>
<footer><span>Слой A: Munder Difflin локально. Слой B: этот сайт на Vercel.</span>
<a href="https://github.com/chaitanyagiri/munder-difflin">upstream</a>
<a href="https://github.com/nyzbk/agency-digital-office">repo</a></footer>
<script src="floor.js"></script>
</body></html>
